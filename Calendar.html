<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncAthletics | Unified Calendar &amp; Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .modal-backdrop { background-color: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#1E201E] antialiased min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR (Identical to Home Page) -->
  <nav class="bg-white border-b border-[#E5E3DC] sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <!-- Brand Logo -->
      <a href="home.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#1D3528] rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
          S
        </div>
        <span class="font-bold text-2xl tracking-tight text-[#1E201E]">SyncAthletics</span>
      </a>
      
      <!-- Nav Links -->
      <div class="hidden md:flex items-center gap-8 font-medium text-[#4A4E4D] text-sm">
        <a href="home.html" class="hover:text-[#1D3528] transition-colors py-1">Home</a>
        <a href="base-added.html" class="hover:text-[#1D3528] transition-colors py-1">Base+Added</a>
        <a href="Calendar.html" class="text-[#1D3528] font-bold border-b-2 border-[#1D3528] py-1" aria-current="page">Calendar</a>
        <a href="features.html" class="hover:text-[#1D3528] transition-colors py-1">Pricing &amp; Features</a>
        <a href="whyus.html" class="hover:text-[#1D3528] transition-colors py-1">Why Us?</a>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-4">
        <a href="https://accounts.google.com/" class="text-sm font-semibold text-[#1E201E] hover:text-[#1D3528] px-3 py-2 transition-colors">Sign In</a>
        <a href="Calendar.html?startTrial=1" class="text-sm font-semibold text-white bg-[#1D3528] hover:bg-[#15271d] px-5 py-2.5 rounded-xl shadow-sm transition-all transform hover:-translate-y-0.5">Start Free Trial</a>
      </div>
    </div>
  </nav>

  <!-- MAIN CALENDAR WORKSPACE -->
  <main data-subscription-app class="relative flex-grow max-w-7xl w-full mx-auto px-6 py-8">
    
    <!-- Header Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-[#1E201E] tracking-tight">Schedule Calendar</h1>
        <p class="text-sm text-[#6E7271] mt-1">Consolidated view of team practice, MyU lectures, Canvas deadlines, and personal events.</p>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openAddModal()" class="flex items-center gap-2 bg-[#1D3528] hover:bg-[#15271d] text-white font-bold text-xs px-4 py-3 rounded-xl shadow-sm transition-all transform hover:-translate-y-0.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add Event
        </button>
      </div>
    </div>

    <!-- Category Filter Checkboxes -->
    <div class="bg-white p-4 rounded-xl border border-[#E5E3DC] shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4 text-xs">
      <div class="flex items-center gap-2 font-bold text-[#1E201E]">
        <svg class="w-4 h-4 text-[#6E7271]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.447.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/></svg>
        Filter Categories:
      </div>
      <div class="flex flex-wrap items-center gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked onchange="toggleCategory('athletics')" class="accent-[#1D3528] rounded">
          <span class="w-2.5 h-2.5 rounded-full bg-[#1D3528]"></span>
          <span class="font-medium">Athletics</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked onchange="toggleCategory('academic')" class="accent-[#2B4C7E] rounded">
          <span class="w-2.5 h-2.5 rounded-full bg-[#2B4C7E]"></span>
          <span class="font-medium">MyU Classes</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked onchange="toggleCategory('canvas')" class="accent-[#C85A32] rounded">
          <span class="w-2.5 h-2.5 rounded-full bg-[#C85A32]"></span>
          <span class="font-medium">Canvas Homework</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked onchange="toggleCategory('personal')" class="accent-[#7E52A0] rounded">
          <span class="w-2.5 h-2.5 rounded-full bg-[#7E52A0]"></span>
          <span class="font-medium">Work & Personal</span>
        </label>
      </div>
    </div>

    <!-- Calendar Card Container -->
    <div class="bg-white border border-[#E5E3DC] rounded-2xl shadow-lg overflow-hidden">
      <!-- Navigation Toolbar -->
      <div class="p-6 border-b border-[#E5E3DC] flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <h2 id="calendar-title" class="text-xl font-extrabold text-[#1E201E]">November 2026</h2>
          <div class="flex border border-[#E5E3DC] rounded-lg overflow-hidden">
            <button onclick="prevPeriod()" class="px-3 py-1.5 bg-[#FAF9F6] hover:bg-gray-100 text-xs font-bold text-[#1E201E] border-r border-[#E5E3DC]">&larr; Prev</button>
            <button onclick="todayPeriod()" class="px-3 py-1.5 bg-white hover:bg-gray-50 text-xs font-bold text-[#1D3528]">Today</button>
            <button onclick="nextPeriod()" class="px-3 py-1.5 bg-[#FAF9F6] hover:bg-gray-100 text-xs font-bold text-[#1E201E] border-l border-[#E5E3DC]">Next &rarr;</button>
          </div>
        </div>

        <!-- View Switcher -->
        <div class="flex border border-[#E5E3DC] rounded-xl overflow-hidden p-1 bg-[#FAF9F6]">
          <button id="view-month-btn" onclick="switchView('month')" aria-pressed="true" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-white text-[#1D3528] shadow-sm border border-[#E5E3DC]">Month</button>
          <button id="view-week-btn" onclick="switchView('week')" aria-pressed="false" class="px-4 py-1.5 text-xs font-semibold rounded-lg text-[#6E7271]">Week</button>
          <button id="view-day-btn" onclick="switchView('day')" aria-pressed="false" class="px-4 py-1.5 text-xs font-semibold rounded-lg text-[#6E7271]">Day</button>
        </div>
      </div>

      <!-- Month Grid View -->
      <div>
        <div id="calendar-weekdays-container" class="grid grid-cols-7 bg-[#F5F4F0] border-b border-[#E5E3DC] text-center text-xs font-extrabold text-[#6E7271] py-3">
          <!-- Weekday headers rendered by JavaScript -->
        </div>
        <div id="calendar-days-container" class="grid grid-cols-7 text-xs auto-rows-fr divide-x divide-y divide-[#E5E3DC]">
          <!-- Calendar cells rendered by JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <!-- ADD MANUAL EVENT MODAL -->
  <div id="add-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[#E5E3DC]">
      <div class="flex items-center justify-between pb-4 border-b border-[#E5E3DC]">
        <h3 class="text-base font-bold text-[#1E201E]">Add New Schedule Event</h3>
        <button onclick="closeAddModal()" class="text-[#6E7271] hover:text-[#1E201E] font-bold text-lg">&times;</button>
      </div>

      <form onsubmit="saveEvent(event)" class="py-4 space-y-3 text-xs">
        <div>
          <label class="block font-bold text-[#1E201E] mb-1">Event Title</label>
          <input type="text" id="ev-title" required placeholder="e.g. Weightroom Lift / Anatomy Lecture" class="w-full px-3 py-2 border border-[#E5E3DC] rounded-xl focus:outline-none focus:border-[#1D3528]">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-[#1E201E] mb-1">Date</label>
            <input type="date" id="ev-date" required value="2026-11-04" class="w-full px-3 py-2 border border-[#E5E3DC] rounded-xl focus:outline-none focus:border-[#1D3528]">
          </div>
          <div>
            <label class="block font-bold text-[#1E201E] mb-1">Category</label>
            <select id="ev-category" class="w-full px-3 py-2 border border-[#E5E3DC] rounded-xl focus:outline-none focus:border-[#1D3528]">
              <option value="athletics">Athletics</option>
              <option value="academic">MyU Class</option>
              <option value="canvas">Canvas Homework</option>
              <option value="personal">Work / Personal</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-[#1E201E] mb-1">Start Time</label>
            <input type="time" id="ev-start" value="14:00" class="w-full px-3 py-2 border border-[#E5E3DC] rounded-xl focus:outline-none">
          </div>
          <div>
            <label class="block font-bold text-[#1E201E] mb-1">End Time</label>
            <input type="time" id="ev-end" value="15:30" class="w-full px-3 py-2 border border-[#E5E3DC] rounded-xl focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block font-bold text-[#1E201E] mb-1">Location</label>
          <input type="text" id="ev-location" placeholder="e.g. Fieldhouse / Hall 102" class="w-full px-3 py-2 border border-[#E5E3DC] rounded-xl focus:outline-none">
        </div>

        <div class="pt-4 border-t border-[#E5E3DC] flex justify-end gap-2">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-gray-100 text-[#1E201E] font-bold rounded-xl">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#1D3528] text-white font-bold rounded-xl shadow-sm">Save to Calendar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    let currentDate = new Date(2026, 10, 4);
    let currentView = 'month';
    let activeCategories = { athletics: true, academic: true, canvas: true, personal: true };

    let events = [
      { id: 1, title: 'Morning Lift & Core', date: '2026-11-02', time: '06:30 AM', category: 'athletics', location: 'Varsity Gym' },
      { id: 2, title: 'KIN 3101 Anatomy', date: '2026-11-03', time: '10:00 AM', category: 'academic', location: 'Hall 204' },
      { id: 3, title: 'Team Practice', date: '2026-11-04', time: '03:30 PM', category: 'athletics', location: 'Main Turf' },
      { id: 4, title: 'Biomechanics Quiz', date: '2026-11-04', time: '11:59 PM', category: 'canvas', location: 'Canvas LMS' },
      { id: 5, title: 'Lab Section', date: '2026-11-05', time: '01:00 PM', category: 'academic', location: 'Science Bldg 12' },
      { id: 6, title: 'Travel Day to Away Game', date: '2026-11-06', time: '08:00 AM', category: 'athletics', location: 'Team Bus' },
      { id: 7, title: 'SEASON AWAY GAME', date: '2026-11-07', time: '02:00 PM', category: 'athletics', location: 'Stadium' }
    ];

    function renderCalendar() {
      const container = document.getElementById('calendar-days-container');
      const weekdayContainer = document.getElementById('calendar-weekdays-container');
      container.innerHTML = '';
      weekdayContainer.innerHTML = '';

      let dates = [];
      if (currentView === 'month') {
        const firstDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        const firstDay = firstDate.getDay();
        const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) dates.push(null);
        for (let day = 1; day <= daysInMonth; day++) {
          dates.push(new Date(currentDate.getFullYear(), currentDate.getMonth(), day));
        }
        document.getElementById('calendar-title').textContent = currentDate.toLocaleDateString('en-US', {
          month: 'long',
          year: 'numeric'
        });
      } else if (currentView === 'week') {
        const weekStart = new Date(currentDate);
        weekStart.setDate(currentDate.getDate() - currentDate.getDay());
        dates = Array.from({ length: 7 }, (_, index) => {
          const date = new Date(weekStart);
          date.setDate(weekStart.getDate() + index);
          return date;
        });
        const weekEnd = dates[6];
        const startLabel = dates[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const endLabel = weekStart.getMonth() === weekEnd.getMonth() && weekStart.getFullYear() === weekEnd.getFullYear()
          ? `${weekEnd.getDate()}, ${weekEnd.getFullYear()}`
          : weekEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        document.getElementById('calendar-title').textContent = `${startLabel} – ${endLabel}`;
      } else {
        dates = [new Date(currentDate)];
        document.getElementById('calendar-title').textContent = currentDate.toLocaleDateString('en-US', {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
      }

      const weekdayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const visibleWeekdays = currentView === 'month'
        ? weekdayNames
        : dates.filter(Boolean).map((date) => weekdayNames[date.getDay()]);
      visibleWeekdays.forEach((name) => {
        const weekday = document.createElement('div');
        weekday.textContent = name;
        weekdayContainer.appendChild(weekday);
      });

      const columns = currentView === 'day' ? 'grid-cols-1' : 'grid-cols-7';
      weekdayContainer.classList.remove('grid-cols-1', 'grid-cols-7');
      container.classList.remove('grid-cols-1', 'grid-cols-7');
      weekdayContainer.classList.add(columns);
      container.classList.add(columns);

      dates.forEach((date) => {
        const cell = document.createElement('div');
        if (!date) {
          cell.className = 'p-2 min-h-[110px] bg-gray-50/50 text-gray-300';
          container.appendChild(cell);
          return;
        }

        const dateStr = [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, '0'),
          String(date.getDate()).padStart(2, '0')
        ].join('-');
        const isToday = dateStr === '2026-11-04';
        const cellHeight = currentView === 'month' ? 'min-h-[110px]' : 'min-h-[320px]';
        cell.className = `p-2 ${cellHeight} bg-white transition-colors hover:bg-[#FAF9F6] ${isToday ? 'bg-[#FAF9F6]' : ''}`;
        
        let cellHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="${isToday ? 'w-6 h-6 bg-[#1D3528] text-white rounded-full flex items-center justify-center font-bold' : 'font-bold text-[#1E201E]'}">${date.getDate()}</span>
          </div>
          <div class="space-y-1">
        `;

        // Render matching events
        const dayEvents = events.filter(e => e.date === dateStr && activeCategories[e.category]);
        dayEvents.forEach(ev => {
          let badgeClass = 'bg-[#1D3528] text-white';
          if (ev.category === 'academic') badgeClass = 'bg-[#2B4C7E] text-white';
          if (ev.category === 'canvas') badgeClass = 'bg-[#C85A32] text-white';
          if (ev.category === 'personal') badgeClass = 'bg-[#7E52A0] text-white';

          cellHTML += `
            <div onclick="removeEvent(${ev.id})" class="p-1 rounded text-[10px] font-semibold cursor-pointer truncate shadow-sm ${badgeClass}" title="Click to delete">
              ${ev.time ? ev.time + ' ' : ''}${ev.title}
            </div>
          `;
        });

        cellHTML += `</div>`;
        cell.innerHTML = cellHTML;
        container.appendChild(cell);
      });
    }

    // Modal Control Functions
    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

    // Manual Event Saving
    function saveEvent(e) {
      e.preventDefault();
      const title = document.getElementById('ev-title').value;
      const date = document.getElementById('ev-date').value;
      const category = document.getElementById('ev-category').value;
      const start = document.getElementById('ev-start').value;
      const location = document.getElementById('ev-location').value;

      events.push({
        id: Date.now(),
        title,
        date,
        time: start,
        category,
        location
      });

      closeAddModal();
      renderCalendar();
    }

    function removeEvent(id) {
      if (confirm("Remove this event from calendar?")) {
        events = events.filter(e => e.id !== id);
        renderCalendar();
      }
    }

    function toggleCategory(cat) {
      activeCategories[cat] = !activeCategories[cat];
      renderCalendar();
    }

    function changePeriod(direction) {
      const date = new Date(currentDate);
      if (currentView === 'month') {
        date.setDate(1);
        date.setMonth(date.getMonth() + direction);
        date.setDate(Math.min(currentDate.getDate(), new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate()));
      } else {
        date.setDate(date.getDate() + direction * (currentView === 'week' ? 7 : 1));
      }
      currentDate = date;
      renderCalendar();
    }

    function prevPeriod() { changePeriod(-1); }
    function nextPeriod() { changePeriod(1); }
    function todayPeriod() { currentDate = new Date(2026, 10, 4); renderCalendar(); }

    function switchView(view) {
      currentView = view;
      ['month', 'week', 'day'].forEach((viewName) => {
        const button = document.getElementById(`view-${viewName}-btn`);
        const active = viewName === view;
        button.setAttribute('aria-pressed', String(active));
        button.className = active
          ? 'px-4 py-1.5 text-xs font-bold rounded-lg bg-white text-[#1D3528] shadow-sm border border-[#E5E3DC]'
          : 'px-4 py-1.5 text-xs font-semibold rounded-lg text-[#6E7271]';
      });
      renderCalendar();
    }

    // Initialize Calendar on load
    renderCalendar();
  </script>
  <script src="subscription.js"></script>

</body>
</html>
